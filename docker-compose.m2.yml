# M2-A additive overlay. Does not alter the validated M1 services.
# Apply with: docker compose -f docker-compose.yml -f docker-compose.m2.yml ...
services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      CLUSTER_ID: "EOToQcZLRjafYROfUZaQVw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.3
    hostname: connect
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "zibal_connect_worker"
      CONFIG_STORAGE_TOPIC: "zibal_connect_configs"
      OFFSET_STORAGE_TOPIC: "zibal_connect_offsets"
      STATUS_STORAGE_TOPIC: "zibal_connect_status"
      # Single-broker Kafka: Connect's internal topics cannot have replication factor 3.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      HEAP_OPTS: "-Xms256m -Xmx768m"
      OFFSET_FLUSH_INTERVAL_MS: "10000"
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  kafka_data:
